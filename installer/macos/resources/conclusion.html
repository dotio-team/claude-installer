<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<style>
  body{font-family:-apple-system,"Pretendard Variable","Apple SD Gothic Neo",sans-serif;color:#1F1E1B;line-height:1.55;padding:18px 8px;}
  h1{font-size:20px;margin:0 0 12px;}
  p{font-size:13px;color:#54524D;margin:0 0 10px;}
  code{background:#F2EFE7;padding:1px 6px;border-radius:4px;font-family:"JetBrains Mono",Menlo,monospace;font-size:12.5px;color:#1F1E1B;}
  .check{color:#4F7A4D;font-weight:700;}
</style></head>
<body>
  <h1><span class="check">✓</span> 설치가 완료되었습니다.</h1>
  <p>새 터미널을 열고 다음을 입력해 보세요:</p>
  <p><code>claude --version</code> — 버전이 출력되면 준비 완료입니다.</p>
  <p><code>claude</code> — 대화를 시작합니다.</p>
  <p style="margin-top:14px;font-size:12px;color:#8A877F;">문제가 생기면 <code>~/Library/Logs/ClaudeInstaller/install.log</code>를 확인해주세요.</p>
</body>
</html>
