<!doctype html>
<html lang="ko">
<head><meta charset="utf-8" />
<style>
  /* The macOS Installer renders these in the system theme. In dark mode it
     forces light text but keeps explicit backgrounds — so we use semi-
     transparent backgrounds and let text color inherit. */
  :root { color-scheme: light dark; }
  body{font-family:-apple-system,"Pretendard Variable","Apple SD Gothic Neo",sans-serif;line-height:1.55;padding:18px 8px;}
  h1{font-size:20px;margin:0 0 12px;}
  p{font-size:13px;margin:0 0 10px; opacity:0.85;}
  code{
    background:rgba(127,127,127,0.18);
    padding:1px 6px;border-radius:4px;
    font-family:"JetBrains Mono",Menlo,monospace;font-size:12.5px;
    /* no color — inherits from surrounding text, so it stays readable
       whether the installer is rendering us in light or dark mode */
  }
  .check{color:#4F7A4D;font-weight:700;}
  @media (prefers-color-scheme: dark) {
    .check{color:#7DBE7B;}
  }
</style></head>
<body>
  <h1><span class="check">✓</span> 설치가 완료되었습니다.</h1>
  <p>새 터미널을 열고 다음을 입력해 보세요:</p>
  <p><code>claude --version</code> — 버전이 출력되면 준비 완료입니다.</p>
  <p><code>claude</code> — 대화를 시작합니다.</p>
  <p style="margin-top:14px;font-size:12px;opacity:0.65;">문제가 생기면 터미널에서 <code>claude-doctor</code>를 실행하고 결과를 <b>admin@dotio.team</b>으로 보내주세요.</p>
</body>
</html>
