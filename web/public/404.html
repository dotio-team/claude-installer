<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>찾을 수 없습니다 · 도티오 Claude 인스톨러</title>
  <style>
    :root{--bg:#FAF9F5;--ink:#1F1E1B;--muted:#54524D;--accent:#CC785C;}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable","Inter",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;}
    main{max-width:520px;text-align:center;}
    h1{font-family:"Source Serif 4","Noto Serif KR",Georgia,serif;font-weight:500;font-size:48px;line-height:1.1;letter-spacing:-0.02em;margin:0 0 16px;}
    p{color:var(--muted);font-size:17px;line-height:1.6;margin:0 0 32px;}
    a{display:inline-block;background:var(--accent);color:#FAF9F5;padding:16px 24px;border-radius:12px;text-decoration:none;font-weight:600;}
    a:hover{background:#B5654C;}
  </style>
</head>
<body>
  <main>
    <h1>여기엔 아무것도 없어요.</h1>
    <p>찾으시는 페이지가 사라졌거나, 주소가 잘못된 것 같습니다.</p>
    <a href="/">처음으로 돌아가기</a>
  </main>
</body>
</html>
