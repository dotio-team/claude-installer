name: Build & publish installers

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.0'

jobs:
  # --- macOS .pkg --------------------------------------------------------
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build .pkg
        run: |
          export VERSION="${TAG#v}"
          bash installer/macos/build.sh
        env:
          TAG: ${{ inputs.version || github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: installer/macos/dist/ClaudeCode-Installer.pkg
          if-no-files-found: error

  # --- macOS smoke test (clean-room install on a fresh runner) ----------
  smoke-macos:
    needs: build-macos
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with: { name: macos-pkg, path: . }
      - name: Install the .pkg as root (matches user double-click)
        run: sudo installer -pkg ClaudeCode-Installer.pkg -target /
      - name: Verify claude is installed AND the native binary works
        run: |
          export PATH="/usr/local/bin:$PATH"
          which claude
          OUT="$(claude --version 2>&1 || true)"
          echo "claude --version => $OUT"
          if ! echo "$OUT" | grep -qE '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::native binary missing or postinstall didn't run"
            echo "---install log---"
            sudo cat /var/log/claude-installer.log 2>/dev/null || true
            exit 1
          fi
      - name: Verify uninstaller works
        run: |
          /usr/local/bin/claude-uninstall
          ! command -v claude >/dev/null 2>&1 || (echo "claude still on PATH after uninstall" && exit 1)

  # --- Windows .exe ------------------------------------------------------
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding ascii
      - name: Build .exe
        shell: cmd
        working-directory: installer/windows
        env:
          APP_VERSION_RAW: ${{ inputs.version || github.ref_name }}
        run: |
          set APP_VERSION=%APP_VERSION_RAW:v=%
          iscc installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: installer/windows/dist/ClaudeCode-Installer.exe
          if-no-files-found: error

  # --- Windows smoke test (clean-room install) ---------------------------
  smoke-windows:
    needs: build-windows
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with: { name: windows-exe, path: . }
      - name: Install silently (matches the user's double-click + Run path)
        shell: cmd
        run: |
          ClaudeCode-Installer.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=install-trace.log
          echo Exit code: %errorlevel%
          if %errorlevel% neq 0 type install-trace.log
      - name: Verify claude works after install
        shell: cmd
        run: |
          set "PATH=%ProgramFiles%\nodejs;%ProgramFiles%\Git\cmd;%APPDATA%\npm;%PATH%"
          where claude
          claude --version > out.txt 2>&1
          type out.txt
          findstr /r "[0-9][0-9]*\.[0-9][0-9]*\.[0-9]" out.txt >nul || (
            echo ERROR: native binary missing or postinstall didn't run
            type "%APPDATA%\ClaudeInstaller\install.log" 2>nul
            exit /b 1
          )
      - name: Verify claude works in a fresh PowerShell (registry PATH, Restricted policy)
        shell: powershell
        run: |
          # Rebuild PATH the way a newly opened terminal would: from the
          # registry only, no inherited process PATH. This is what real users
          # hit right after install — the cmd step above can't catch
          # persistence bugs because it injects the paths by hand.
          $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = [Environment]::ExpandEnvironmentVariables("$machine;$user")
          where.exe claude
          if (Test-Path "$env:APPDATA\npm\claude.ps1") {
            Write-Error 'claude.ps1 shim still present - PowerShell would hit the execution-policy wall'
            exit 1
          }
          # Simulate the Windows client default policy; claude must still run.
          powershell -NoProfile -ExecutionPolicy Restricted -Command "claude --version" > ps-out.txt 2>&1
          Get-Content ps-out.txt
          if (-not (Select-String -Path ps-out.txt -Pattern '\d+\.\d+\.\d+' -Quiet)) {
            Write-Error 'claude --version failed in a Restricted-policy PowerShell'
            Get-Content "$env:APPDATA\ClaudeInstaller\install.log" -ErrorAction SilentlyContinue
            exit 1
          }

  # --- Publish to GitHub Releases ----------------------------------------
  publish:
    needs: [smoke-macos, smoke-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-pkg
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: artifacts/
      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          NOTES="Claude Code 원클릭 인스톨러 ${TAG}\n\n다운로드:\n- macOS: ClaudeCode-Installer.pkg\n- Windows: ClaudeCode-Installer.exe\n\n설치 방법: https://claude-installer-psi.vercel.app"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/ClaudeCode-Installer.pkg artifacts/ClaudeCode-Installer.exe --clobber
          else
            gh release create "$TAG" \
              artifacts/ClaudeCode-Installer.pkg \
              artifacts/ClaudeCode-Installer.exe \
              --title "$TAG" \
              --notes "$(printf "$NOTES")" \
              --latest
          fi
